name: MLOps Customer Predictor Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r visit_with_us_mlops/requirements.txt

    - name: Validate Dataset
      run: |
        python visit_with_us_mlops/validate_data.py

    - name: Preprocess and Clean Data
      run: |
        python visit_with_us_mlops/prepare_data.py

    - name: Train & Tune Champion Model (XGBoost)
      run: |
        python visit_with_us_mlops/train_xgboost.py

    - name: Verify Training Artifacts
      run: |
        if [ ! -f visit_with_us_mlops/models/best_model.pkl ]; then
          echo "Error: Model artifact not found!"
          exit 1
        fi
        if [ ! -f visit_with_us_mlops/models/metrics.json ]; then
          echo "Error: Metrics log not found!"
          exit 1
        fi
        echo "Success: All artifacts successfully built and validated!"
